name: Build Launcher EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create HTA file
        shell: cmd
        run: |
          copy index.html launcher.hta
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrifLauncher
          path: launcher.hta
